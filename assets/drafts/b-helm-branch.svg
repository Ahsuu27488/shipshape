<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">shipshape: helm branch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143049"/>
      <stop offset="1" stop-color="#08131E"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8B66"/>
      <stop offset="1" stop-color="#EE5A36"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
  <g stroke="#F0DDBE" stroke-linecap="round">
    <!-- spokes, each ending in a handle -->
    <g stroke-width="16">
      <line x1="256" y1="96" x2="256" y2="416"/>
      <line x1="96" y1="256" x2="416" y2="256"/>
      <line x1="143" y1="143" x2="369" y2="369"/>
      <line x1="369" y1="143" x2="143" y2="369"/>
    </g>
    <circle cx="256" cy="256" r="118" fill="none" stroke-width="24"/>
  </g>
  <g fill="#F0DDBE">
    <circle cx="256" cy="92" r="18"/><circle cx="256" cy="420" r="18"/>
    <circle cx="92" cy="256" r="18"/><circle cx="420" cy="256" r="18"/>
    <circle cx="140" cy="140" r="18"/><circle cx="372" cy="372" r="18"/>
    <circle cx="372" cy="140" r="18"/><circle cx="140" cy="372" r="18"/>
  </g>
  <!-- hub: a git branch -->
  <circle cx="256" cy="256" r="64" fill="url(#hub)"/>
  <g stroke="#FFF8EC" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="238" y1="226" x2="238" y2="290"/>
    <path d="M276 236 C 276 262 238 256 238 278"/>
  </g>
  <g fill="#FFF8EC">
    <circle cx="238" cy="224" r="11"/><circle cx="238" cy="292" r="11"/><circle cx="276" cy="232" r="11"/>
  </g>
